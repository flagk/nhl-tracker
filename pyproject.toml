[project]
name = "nhlbet"
version = "0.2.0"
description = "Research-grade NHL game outcome model with calibration, odds/CLV tracking and risk-managed staking"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "scipy>=1.10", "requests>=2.31",
  "pyyaml>=6.0", "joblib>=1.3", "matplotlib>=3.7", "lightgbm>=4.0", "xgboost>=2.0",
]

[project.optional-dependencies]
analysis = ["shap>=0.44"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["nhlbet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
