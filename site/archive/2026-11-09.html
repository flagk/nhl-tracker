<style>
/* Shared look for the picks, bets and history pages. Rink-side data sheet: ice-blue neutrals, navy ink, one red-line accent.
   Layout concept: sticky top bar (brand, page nav, theme) over a single readable column; sections are headed by a condensed
   scoreboard face and jump-linked from a chip row; probabilities are drawn as bars, not just printed. */
:root {
  --bg: #edf1f6; --surface: #ffffff; --surface-2: #f4f7fb; --ink: #0d1a2b; --muted: #54657b; --line: #d6dfea; --line-strong: #bccadb;
  --accent: #cf2f2a; --accent-ink: #ffffff; --blue: #1d5fa8; --blue-soft: #dce9f8;
  --good: #167447; --good-bg: #e3f4ea; --warn: #8f5200; --warn-bg: #fff0d1; --bad: #b4281f; --bad-bg: #fde7e4;
  --shadow: 0 1px 2px rgba(13, 26, 43, .06), 0 6px 18px rgba(13, 26, 43, .05);
  --display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1018; --surface: #121b27; --surface-2: #172230; --ink: #e8eff7; --muted: #92a4b8; --line: #223142; --line-strong: #31465d;
    --accent: #ff6a5c; --accent-ink: #1a0a08; --blue: #74aaf0; --blue-soft: #16304d;
    --good: #4cc38a; --good-bg: #12301f; --warn: #e6b13b; --warn-bg: #30270f; --bad: #ff8e84; --bad-bg: #33171a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1018; --surface: #121b27; --surface-2: #172230; --ink: #e8eff7; --muted: #92a4b8; --line: #223142; --line-strong: #31465d;
  --accent: #ff6a5c; --accent-ink: #1a0a08; --blue: #74aaf0; --blue-soft: #16304d;
  --good: #4cc38a; --good-bg: #12301f; --warn: #e6b13b; --warn-bg: #30270f; --bad: #ff8e84; --bad-bg: #33171a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
a { color: var(--blue); text-underline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }

/* ---- top bar ---- */
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1080px; margin: 0 auto; padding: .55rem 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: .55rem; text-decoration: none; color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: .02em; text-transform: uppercase; }
.brand-mark { width: 12px; height: 26px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) 0 40%, transparent 40% 60%, var(--accent) 60% 100%); }
.nav { display: flex; gap: .15rem; margin-left: .5rem; flex: 1; min-width: 0; }
.nav a { color: var(--muted); text-decoration: none; padding: .4rem .8rem; border-radius: 999px; font-weight: 600; font-size: .95rem; }
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--surface-2); box-shadow: inset 0 -2px 0 var(--accent); border-radius: 8px 8px 0 0; }
.theme-btn { font: inherit; font-size: .8rem; font-weight: 600; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: .3rem .75rem; cursor: pointer; }
.theme-btn:hover { color: var(--ink); border-color: var(--line-strong); }

/* ---- page ---- */
.wrap { max-width: 1080px; margin: 0 auto; padding: 1.25rem 1rem 3rem; display: flex; flex-direction: column; gap: 1.5rem; min-width: 0; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .5rem 1rem; }
.pagehead h1 { font-size: clamp(2rem, 5vw, 3rem); text-transform: uppercase; letter-spacing: .01em; }
.pagehead .when { color: var(--muted); font-size: .95rem; }
.note { color: var(--muted); font-size: .88rem; }
.statusbar { display: flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.stat { flex: 1 1 140px; padding: .8rem 1rem; display: flex; flex-direction: column; gap: .1rem; border-right: 1px solid var(--line); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat .k { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stat .v { font-family: var(--display); font-weight: 700; font-size: 1.7rem; line-height: 1.1; }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; }
.chip { text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: .3rem .8rem; border-radius: 999px; font-size: .88rem; font-weight: 600; }
.chip:hover { border-color: var(--accent); }
button.chip { font-family: inherit; cursor: pointer; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.section { display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
.section > h2 { font-size: 1.6rem; text-transform: uppercase; letter-spacing: .02em; display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
.section > h2 .count { font-size: .95rem; color: var(--muted); font-family: var(--body); font-weight: 600; text-transform: none; letter-spacing: 0; }
.lead { color: var(--muted); max-width: 70ch; margin: 0; }

/* ---- surfaces ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.scroll { overflow-x: auto; }
.banner { border-radius: var(--radius); padding: .65rem .9rem; font-size: .92rem; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.banner.disc { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.banner.bad { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.banner.good { background: var(--good-bg); color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.pill { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .1rem .65rem; font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.pill.rec { background: var(--accent); color: var(--accent-ink); }
.pill.lean { background: var(--warn-bg); color: var(--warn); }
.pill.ok { background: var(--good-bg); color: var(--good); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.alert { background: var(--bad-bg); color: var(--bad); }
.pill.mute { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.good { color: var(--good); } .bad { color: var(--bad); } .muted { color: var(--muted); }

/* ---- pick cards ---- */
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 24rem), 1fr)); gap: .9rem; }
.pick { display: flex; flex-direction: column; gap: .8rem; }
.pick.is-rec { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.pick-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
.pick-team { font-family: var(--display); font-weight: 700; font-size: 1.9rem; line-height: 1; text-transform: uppercase; }
.pick-sub { color: var(--muted); font-size: .88rem; margin-top: .2rem; }
.pbar { display: flex; flex-direction: column; gap: .35rem; }
.pbar-track { position: relative; height: 12px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.pbar-fill { position: absolute; inset: 0 auto 0 0; background: var(--blue); }
.pbar-gap { position: absolute; top: 0; bottom: 0; }
.pbar-gap.up { background: var(--good); } .pbar-gap.down { background: var(--bad); opacity: .85; }
.pbar-mkt { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1px; background: var(--ink); border-radius: 2px; }
.pbar-labels { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); gap: .5rem; flex-wrap: wrap; }
.pbar-labels b { color: var(--ink); font-weight: 700; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: .6rem 1rem; }
.kv > div { display: flex; flex-direction: column; min-width: 0; }
.kv .k { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kv .v { font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1.2; }
.why { font-size: .88rem; color: var(--muted); margin: 0; }
.why ul { margin: .3rem 0 0 1.1rem; padding: 0; }
.mine { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding-top: .7rem; border-top: 1px dashed var(--line-strong); }
.mine label { margin: 0; }
.mine-out { font-size: .88rem; flex-basis: 100%; }

/* ---- tables ---- */
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: .5rem .65rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
tbody tr:hover { background: var(--surface-2); }
td.num, th.num { text-align: right; }
.edge-cell { display: inline-flex; align-items: center; gap: .4rem; font-weight: 700; }
.dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.up { background: var(--good); } .dot.down { background: var(--bad); }

.reason { display: flex; flex-direction: column; gap: .2rem; align-items: flex-start; max-width: 30ch; font-size: .82rem; }
.mine select { padding: .3rem .4rem; font-size: .85rem; } .mine input { padding: .3rem .5rem; font-size: .85rem; width: 6rem; }
td .mine { padding: 0; border: 0; flex-wrap: nowrap; }
@media (max-width: 640px) {
  table.rtable thead { display: none; }
  table.rtable, table.rtable tbody { display: block; }
  table.rtable tr { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem 1rem; padding: .75rem .1rem; border-bottom: 1px solid var(--line); }
  table.rtable tr:last-child { border-bottom: 0; }
  table.rtable td { display: flex; flex-direction: column; border: 0; padding: .1rem 0; text-align: left; min-width: 0; }
  table.rtable td.num { text-align: left; }
  table.rtable td:first-child { grid-column: 1 / -1; font-size: 1rem; }
  table.rtable td::before { content: attr(data-label); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  table.rtable td:first-child::before { display: none; }
  table.rtable td[colspan] { display: block; grid-column: 1 / -1; }
  table.rtable td[colspan]::before { display: none; }
  .card.scroll { padding: .4rem .8rem; }
}

/* ---- game breakdowns ---- */
details.gamebox > summary { justify-content: space-between; }
details.gamebox > summary::after { margin-left: .5rem; }
.gd-title { display: inline-flex; gap: .35rem; align-items: baseline; flex-wrap: wrap; }
.drawer-body h3 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: .02em; margin-top: .4rem; }
.drivers { display: flex; flex-direction: column; gap: .35rem; }
.drow { display: grid; grid-template-columns: minmax(8rem, 15rem) 1fr 5.5rem; gap: .6rem; align-items: center; font-size: .88rem; }
.dhead .dends { display: flex; justify-content: space-between; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.dtrack { position: relative; height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }

.dbar { position: absolute; top: 0; bottom: 0; }

.sgroup { margin-top: .8rem; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding-bottom: .2rem; border-bottom: 1px solid var(--line-strong); }
.srow { display: grid; grid-template-columns: 1fr minmax(0, 2.2fr) 1fr; gap: .6rem; align-items: center; padding: .3rem 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.slabel { text-align: center; color: var(--muted); font-size: .85rem; }
.sval { font-weight: 600; padding: .1rem .5rem; border-radius: 6px; }

.ilabel { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; font-size: .92rem; }

@media (max-width: 640px) { .drow, .irow { grid-template-columns: 1fr; gap: .15rem; } .dval { text-align: left; } .srow { font-size: .85rem; } }

.hist { position: relative; display: flex; align-items: flex-end; gap: 5px; height: 64px; padding: 0 0 0 1.4rem; border-bottom: 1px solid var(--line-strong); }
.hbar { flex: 1; min-width: 8px; max-width: 28px; border-radius: 3px 3px 0 0; display: flex; justify-content: center; align-items: flex-start; font-size: .68rem; color: var(--surface); font-weight: 700; }

label { display: block; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: .25rem; }
input, select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: .45rem .6rem; min-width: 0; }
input, select { width: 100%; }

.mine input { width: 7.5rem; }
button { cursor: pointer; width: auto; font-weight: 600; }
button:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: .5rem 1.1rem; }
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { background: transparent; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: .8rem 1rem; }

details.drawer > summary { cursor: pointer; list-style: none; padding: .8rem 1.1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; font-weight: 600; }
details.drawer > summary::-webkit-details-marker { display: none; }

details.drawer[open] > summary::after { content: "Close"; }
details.drawer > .drawer-body { padding: 0 1.1rem 1.1rem; display: flex; flex-direction: column; gap: .8rem; }
.tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: .45rem 1rem; border-radius: 7px; }
.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, .08); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: .6rem 1rem; }
.metric .v { font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.15; }
.metric .k { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.check { display: flex; gap: .5rem; align-items: center; font-size: .9rem; text-transform: none; letter-spacing: 0; color: var(--ink); }
.check input { width: auto; }
.chart { width: 100%; height: auto; display: block; color: var(--muted); }
.footer { color: var(--muted); font-size: .85rem; display: flex; flex-direction: column; gap: .6rem; }
.stack { display: flex; flex-direction: column; gap: .6rem; }
.row { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; align-items: baseline; }
@media (max-width: 640px) {

</style>

    if (t.clv && t.clv.n >= 5) m.push(metric("Avg CLV per $1 (pays the margin)", spct(t.clv.mean)), metric("Beat the close", pct(t.clv.beat_close, 0)));
    if (t.clv && t.clv.move_pts !== undefined && t.clv.move_pts !== null) m.push(metric("Line moved our way (pts)", (t.clv.move_pts >= 0 ? "+" : "") + t.clv.move_pts.toFixed(2)));
    if (t.model) m.push(metric("Model log loss", t.model.log_loss.toFixed(4)));
    if (t.vs_market) m.push(metric("Market-close log loss", t.vs_market.market_close_log_loss.toFixed(4)));
    kids.push(el("div", { class: "card stack" }, [el("div", { class: "metrics" }, m),
      el("div", { class: "note", text: (t.bets && t.bets.n < 500 ? "Fewer than 500 bets cannot separate skill from luck (about 6,900 are needed to detect a true 3% ROI). " : "") + "Coin-flip log loss is 0.6931." })]));
    return section("sec-track", "Track record", "", kids);
  }

  function paper() {
    var kids = [el("p", { class: "lead", text: "Alternative strategies run on every slate with pretend stakes, to measure what works faster than the selective live policy can. market_favorite is a no-skill control: a strategy only means something if it beats it by more than the noise. Details on the Bets page." })];
    if (!D.paper || !D.paper.length) return section("sec-paper", "Fake bets", "paper trading", kids.concat([el("div", { class: "card muted", text: "No settled paper bets yet." })]));
    var rows = D.paper.map(function (r) {
      return el("tr", {}, [el("td", {}, [el("b", { text: r.strategy })]), el("td", { class: "num", text: String(r.bets) }), el("td", { class: "num " + (r.bets && r.roi < 0 ? "bad" : r.bets ? "good" : ""), text: r.bets ? spct(r.roi) : "–" }),
        el("td", { class: "num", text: r.roi_lo === null || r.roi_lo === undefined ? "–" : spct(r.roi_lo) + " to " + spct(r.roi_hi) }),
        el("td", { class: "num", text: r.bets ? pct(r.win_rate, 0) : "–" }), el("td", { class: "num", text: r.n_clv ? spct(r.avg_clv) : "–" })]);
    });
    kids.push(table(["Strategy", "Bets", "ROI", "95% CI", "Win rate", "Avg CLV"], rows, [1, 2, 3, 4, 5]));
    return section("sec-paper", "Fake bets", "paper trading", kids);
  }

  var dynamic = el("div", { class: "stack", style: "gap:1.5rem" });
  function render() {
    var alloc = C.allocate(D.games, cfg());
    dynamic.replaceChildren(statusBar(alloc), evidence(), rankingSection(), topPicks(alloc), allGames(alloc), gameStats(), otherMarkets(), playerProps(), section("sec-parlay", "Parlays", "", [aiParlays(), el("h3", { text: "Build your own" }), parlayBox]), modelInputs(), track(), paper());
    renderParlay();
  }
  document.body.insertBefore(CH.topbar("picks"), app);
  app.replaceChildren(heading(), chips(), settingsPanel(), dynamic, el("footer", { class: "footer" }, [el("div", { class: "banner disc", text: D.disclaimer }),
    el("div", {}, ["Past days: ", el("a", { href: (location.pathname.indexOf("/archive/") >= 0 ? "../" : "") + "history.html", text: "history and results" }), "."])]));
  render();
  if (location.hash.indexOf("#game-") === 0) openGame(location.hash.slice(6));
})();
</script>
