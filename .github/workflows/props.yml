name: Player props backtest
# Fills shots on goal for already-ingested games from their cached boxscores, then runs the walk-forward shots model backtest -> reports/PROPS.md (manual).
on:
  workflow_dispatch:
    inputs:
      eval_start:
        description: "First out-of-sample date"
        default: "2022-10-01"

concurrency:
  group: nhl-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - uses: actions/cache@v4
        with:
          path: |
            data/nhl.db
            data/cache
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-
      - run: python -m nhlbet.data.ingest --reparse-skaters
      - run: python scripts/props_backtest.py --eval-start "${{ github.event.inputs.eval_start }}"
      - name: Commit
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/PROPS.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Player props backtest"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1
