name: Phase 5 risk simulation
# Monte Carlo bankroll simulation (10,000 paths per scenario) with the real moneyline bet template from the pick logs -> reports/risk.md. Push-triggered by ci/phase5_trigger.txt.
on:
  push:
    branches: [hardening]
    paths: ["ci/phase5_trigger.txt"]

permissions:
  contents: write

jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/nhl.db
            data/cache
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-
      - run: python scripts/risk_report.py --db data/nhl.db
      - name: Commit
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/risk.md reports/risk.csv
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Phase 5: risk simulation"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1
