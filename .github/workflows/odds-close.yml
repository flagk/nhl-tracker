name: Closing-line odds snapshots
# Cheap fetch-only runs near puck drop so closing-line value (CLV) can be measured. Uses 1 API credit per run
# (3 here + morning and late daily runs = 5/day, ~150/month of the 500 free credits).
on:
  schedule:
    - cron: "45 22 * * *"   # ~18:45 ET, before the main 19:00 ET wave
    - cron: "20 23 * * *"   # ~19:20 ET, minutes before 19:30/20:00 ET starts: the closest snapshot to the close for most games
    - cron: "45 1 * * *"    # ~21:45 ET, before west-coast starts
  workflow_dispatch:

concurrency:
  group: nhl-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}    # branch tip at job start, not the (possibly stale) triggering commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - uses: actions/cache@v4
        with:
          path: |
            data/nhl.db
            data/cache
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-
      - name: Detect repository visibility (public repos publish only public-safe outputs)
        run: |
          private=$(curl -s -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" | python3 -c "import sys,json; print(str(json.load(sys.stdin).get('private')).lower())" 2>/dev/null || echo unknown)
          if [ "$private" = "true" ]; then echo "PUBLIC_SAFE=0" >> "$GITHUB_ENV"; else echo "PUBLIC_SAFE=1" >> "$GITHUB_ENV"; fi   # unknown -> safe
          echo "repository private=$private"

      - name: Fetch odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py --force
      - name: Commit snapshots
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/logs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Odds snapshot $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1
