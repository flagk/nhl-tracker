name: Deploy picks site to GitHub Pages
# Publishes site/ (today's picks page, per-day archive, history). Stays quiet until Pages is enabled once:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# Runs after every daily run (workflow_run fires even though the daily commit was made with GITHUB_TOKEN, which does not trigger push events).
on:
  workflow_run:
    workflows: ["Daily NHL report"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                       # latest committed site, not the triggering commit

      - name: Is GitHub Pages enabled with source "GitHub Actions"?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ] && grep -q '"build_type": *"workflow"' /tmp/pages.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled with source 'GitHub Actions' (HTTP $code). Enable it once under Settings -> Pages; skipping deploy."
          fi

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.enabled == 'true'
        with:
          path: site
      - id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
