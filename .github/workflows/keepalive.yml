name: Keep scheduled workflows alive
# GitHub switches off scheduled workflows in a public repository after 60 days without repository activity. In season the daily jobs commit many times a
# day; this covers the off-season (no games, no commits) with one small commit a month, only when the last commit is more than 25 days old.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-data
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit a timestamp if the repository has been quiet
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit is $age days old"
          if [ "$age" -lt 25 ]; then exit 0; fi
          mkdir -p data/review
          date -u +%FT%TZ > data/review/keepalive.txt
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/review/keepalive.txt
          git commit -m "Keepalive: repository quiet for $age days"
          git push
