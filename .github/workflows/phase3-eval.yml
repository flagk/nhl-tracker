name: Phase 3 evaluation
# Runs scripts/evaluate.py on the real database (raw per-book quotes exist only there) and re-runs the goals backtest with the widened, pre-selection-date alpha grid.
# Push-triggered by ci/phase3_trigger.txt on the hardening branch (a workflow file that exists only on a branch cannot be dispatched by name).
on:
  push:
    branches: [hardening]
    paths: ["ci/phase3_trigger.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/nhl.db
            data/cache
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-
      - run: python scripts/evaluate.py
      - name: Commit
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/evaluation.md reports/evaluation.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Phase 3: evaluation report"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1
  goals:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/nhl.db
            data/cache
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-
      - run: python scripts/goals_backtest.py --eval-start 2021-10-01
      - name: Commit
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/GOALS.md reports/goals_model.json reports/goals_calibration.json reports/goals_walkforward.csv
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Phase 2: goals backtest with the widened alpha grid chosen before the selection date"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1
