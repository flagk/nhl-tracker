name: Weekly tendencies report
# Descriptive analytics only: never changes the model or staking. Corrected for multiple testing and requires replication.
on:
  schedule:
    - cron: "30 15 * * 0"   # Sundays
  workflow_dispatch:

concurrency:
  group: nhl-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tendencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - uses: actions/cache@v4
        with:
          path: |
            data/nhl.db
            data/cache
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-
      - run: python scripts/tendencies.py
      - name: Commit
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/TENDENCIES.md data/export/tendencies.csv
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Weekly tendencies report"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1
