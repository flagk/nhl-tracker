name: Weekly watch and digest
# Warnings that must never be silent: Claude OAuth token expiry, odds credits, the keepalive workflow, and the weekly status digest.
# Needs the secret NTFY_TOPIC (push alerts, https://docs.ntfy.sh/publish/). Without it the run only prints.
# Cron: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule (UTC, best effort, may start late).
on:
  schedule:
    - cron: "43 12 * * 1"      # Mondays (policy autonomy.digest.weekday: 0)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Watch and digest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ops_watch.py
