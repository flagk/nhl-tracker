name: Daily NHL Predictions & Model Update

on:
  schedule:
    - cron: '14 23 * * *'  # 6:14 PM ET daily
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install pandas scikit-learn matplotlib pyyaml
      
      - name: Retrain model & make predictions
        run: |
          python3.11 test_realistic.py > predictions.log
      
      - name: Generate performance chart
        run: python3.11 src/generate_chart.py
      
      - name: Update README with latest stats
        run: python3.11 src/update_readme.py
      
      - name: Commit results
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "NHL Predictor Bot"
          git add data/models/nhl_model.pkl performance_chart.png predictions.log
          git commit -m "Auto-update: Daily predictions & model retraining" || true
          git push