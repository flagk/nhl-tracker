name: Daily NHL report
# Research/education only - no guarantee of profit. Stake only money you can afford to lose.
on:
  # GitHub cron is best-effort (triggers have arrived 3-6 h late here), so each job is triggered several times and `scripts/gate.py` lets only a
  # useful trigger do work: ONE morning run per game day, ONE late run 20 min - 3 h before the first unstarted game. Late triggers just exit.
  schedule:
    - cron: "0 13 * * *"    # morning window (09:00 ET)
    - cron: "30 14 * * *"   # morning window (10:30 ET)
    - cron: "0 16 * * *"    # morning window (12:00 ET)
    - cron: "0 17 * * *"    # late-run windows: hourly from 13:00 ET, each gated on "first unstarted game 20 min - 3 h away"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "morning or late"
        default: "morning"
      date:
        description: "YYYY-MM-DD (blank = today, US/Eastern)"
        default: ""
      gated:
        description: "true = re-check the schedule gate (used by the heartbeat); false = always run"
        default: "false"

concurrency:
  group: nhl-data          # never let two jobs write the log files at once
  cancel-in-progress: false

permissions:
  contents: write
  actions: write           # to start the Pages deploy directly (workflow_run alone has skipped some runs)

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}    # branch tip at job start, not the (possibly stale) triggering commit
      - name: Restore database + raw API cache (rebuildable; irreplaceable logs live in git under data/logs)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/nhl.db
            data/cache
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-

      - name: Choose run type and gate it
        id: gate_and_type
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 13 * * *"|"30 14 * * *"|"0 16 * * *") KIND=morning ;;
              *) KIND=late ;;
            esac
            FORCE=""
          else
            KIND="${{ github.event.inputs.run_type || 'morning' }}"
            FORCE="--force"; if [ "${{ github.event.inputs.gated }}" = "true" ]; then FORCE=""; fi
          fi
          echo "type=$KIND" >> "$GITHUB_OUTPUT"
          python3 scripts/gate.py --kind "$KIND" $FORCE      # standard library only: runs before dependencies are installed

      - uses: actions/setup-python@v5
        if: steps.gate_and_type.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
        if: steps.gate_and_type.outputs.run == 'true'

      - name: Publish gate (leakage, settlement, count-model and staking tests must pass before anything is published)
        if: steps.gate_and_type.outputs.run == 'true'
        run: python -m pytest -q -x tests/test_no_leakage.py tests/test_audit_phase1.py tests/test_counts.py tests/test_validation.py tests/test_gate.py tests/test_risk.py

      - name: Detect repository visibility (public repos publish only public-safe outputs)
        if: steps.gate_and_type.outputs.run == 'true'
        run: |
          private=$(curl -s -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" | python3 -c "import sys,json; print(str(json.load(sys.stdin).get('private')).lower())" 2>/dev/null || echo unknown)
          if [ "$private" = "true" ]; then echo "PUBLIC_SAFE=0" >> "$GITHUB_ENV"; else echo "PUBLIC_SAFE=1" >> "$GITHUB_ENV"; fi   # unknown -> safe
          echo "repository private=$private"

      - name: Run daily job
        if: steps.gate_and_type.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}      # optional: without it odds are disabled and every game is "no bet"
          BANKROLL: ${{ vars.BANKROLL || '1000' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}            # push alerts for halts (https://docs.ntfy.sh/publish/); without it alerts are only logged
          HC_PING_URL: ${{ secrets.HC_PING_URL }}          # Healthchecks.io: a halt pings /fail (https://healthchecks.io/docs/http_api/)
          POLICY_OWNER_LOGINS: ${{ vars.POLICY_OWNER_LOGINS }}      # who may change config/policy.yaml; read from repo variables, never from files
          POLICY_OWNER_EMAILS: ${{ vars.POLICY_OWNER_EMAILS }}
          GITHUB_TOKEN: ${{ github.token }}                # lets the policy guard ask the commits API who changed the policy file
          REVIEW_ENABLED: ${{ vars.REVIEW_ENABLED || (secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'true' || 'false') }}     # review labels on the page only once the review is configured (see AGENT.md)
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then DATE_ARG="--date ${{ github.event.inputs.date }}"; fi
          python scripts/daily.py --run-type "${{ steps.gate_and_type.outputs.type }}" $DATE_ARG

      - name: Upload picks page (download and open index.html)
        if: steps.gate_and_type.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: picks-site
          path: site/
          retention-days: 14

      - name: Commit results
        if: steps.gate_and_type.outputs.run == 'true'
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A reports data/logs data/models data/export data/review site state README.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily ${{ steps.gate_and_type.outputs.type }} run $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1

      - name: Tamper-evident backup of the logs (a normal push, never forced)
        if: steps.gate_and_type.outputs.run == 'true' && success()
        # The ledger in data/logs/chain.jsonl is verified every run; this second copy lets the owner restore a tampered history. A non-fast-forward push fails on purpose.
        run: |
          git push origin HEAD:refs/heads/log-backup || echo "::warning::log-backup could not be fast-forwarded (diverged history?), investigate"

      - name: Alert that the daily job crashed
        if: steps.gate_and_type.outputs.run == 'true' && failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          pip install requests >/dev/null 2>&1 || true
          python scripts/notify.py --title "NHL daily job FAILED" --priority urgent --key "daily_failed:${{ github.run_id }}" \
            --message "The daily ${{ steps.gate_and_type.outputs.type }} run crashed before publishing. Picks were not updated. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Publish the site
        if: steps.gate_and_type.outputs.run == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "could not start the Pages deploy (the workflow_run trigger is the fallback)"

      - name: Save database + raw API cache
        if: steps.gate_and_type.outputs.run == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/nhl.db
            data/cache
          key: nhl-data-${{ github.run_id }}
